  - id: H-09
    title: "Day-of-week box plot and weekday x hour p90 heatmap, statistics first"
    points: "10 - Tool Design: a clear demonstration on the test datasets (the two new charts)"
    status: done
    owner: "opencode agent + Chiblings"
    started_at: "2026-10-17 12:05"
    owns: ["SPEC.md", "app/qc.py", "tests/", "app/static/"]
    notes: >
      Proposed by the team on 2026-10-17 and agreed in chat ("ok go do this").
      Drops the two average-response-by-priority charts. Adds two DESCRIPTIVE
      charts; they must never create a red or yellow zone. Box plot on
      ln(response_time_min) so the outliers are real ones, quartiles by linear
      interpolation (type 7), Tukey fences Q1 - 1.5*IQR and Q3 + 1.5*IQR.
      Heatmap cells are p90, never the mean, and a cell with fewer than 20
      calls reads "not enough calls", never a number and never 0. SPEC.md
      section 4 and section 6 change first, then the code, then the page.
      One limit found while building it, now stated in SPEC.md section 4: with
      168 cells, one zone fills its grid at Yearly (146 of 168 cells for Bronx);
      at Monthly every cell is under 20 calls and the page says so instead of
      drawing noise.
    definition_of_done: >
      pytest tests passes with the box plot known answer ([6,7,8,9,40]: Q1 7.0,
      median 8.0, Q3 9.0 in minutes, exactly 1 outlier), the log-scale fences
      4.80 and 13.12 minutes (the raw-scale 4.0 and 12.0 are NOT what the chart
      computes), zero outliers for [6,8,7,9,10], a heatmap cell p90 of 9.6
      minutes for [6,8,10], None for a 1-call cell at the default minimum, no
      inf or NaN for constant data, and the zone statuses on every data/
      dataset unchanged from before the change.
    result: "Two descriptive charts, statistics first, 7 new tests. Box plot known answers: [6,7,8,9,40] -> Q1 7.0, median 8.0, Q3 9.0; log-scale fences 4.80 and 13.12 min; whiskers 6.0 and 9.0; exactly 1 outlier; [6,8,7,9,10] -> 0 outliers, whiskers 6.0 and 10.0; constant data -> IQR 0, no inf or NaN; fewer than 5 calls raises ValueError. Heatmap: (Monday, 10) cell p90 = 9.6 min for [6,8,10]; a 1-call cell is None at the default minimum and 'not enough calls' on the page, never 0; counts sum to the period total; stat='mean' is refused. A regression test asserts neither chart moves a zone status. Measured limit now stated in SPEC section 4: Bronx fills 146 of 168 cells at Yearly and 0 of 168 at Monthly, so the page says so instead of drawing noise."

